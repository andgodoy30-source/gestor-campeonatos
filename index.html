<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071d35"><title>COPA CAP 2026</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--navy:#071d35;--navy2:#0c3157;--blue:#12649b;--red:#b5222b;--gold:#d2a64b;--cream:#f3ead4;--bg:#f4f5f7;--text:#142132;--muted:#6d7886}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.hero{background:radial-gradient(circle at 75% 20%,#164f78 0,transparent 35%),linear-gradient(135deg,#06182c,#0b2b4b);color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto -70px -100px auto;width:280px;height:280px;border:30px solid rgba(210,166,75,.08);border-radius:50%}
.wrap{max-width:1080px;margin:auto}.hero-in{min-height:230px;padding:22px 18px;display:flex;align-items:center;gap:28px}
.logo{width:205px;max-height:185px;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.28));background:#fff;border-radius:20px;padding:8px}
.kicker{color:#e3bc67;font-weight:900;letter-spacing:2px;font-size:12px}.hero h1{font-size:36px;margin:7px 0 6px}.hero p{margin:0;color:#d9e3ec}
.nav{background:#fff;border-bottom:3px solid var(--gold);box-shadow:0 2px 12px #0001;position:sticky;top:0;z-index:10}
.nav-in{display:flex;overflow:auto}.nav button{border:0;background:transparent;padding:15px 18px;font-weight:800;color:#44505e;white-space:nowrap;border-bottom:4px solid transparent}
.nav button.active{color:var(--red);border-bottom-color:var(--red)}
main{max-width:1080px;margin:auto;padding:20px 16px 45px}.cats{display:flex;gap:8px;margin-bottom:18px}.cats button{border:1px solid #d6dbe0;background:#fff;padding:9px 17px;border-radius:999px;font-weight:800}.cats button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:4px 0 12px}.section-title h2{margin:0;font-size:20px}.section-title small{color:var(--muted)}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.card{background:#fff;border-radius:15px;box-shadow:0 3px 14px #13263a12;overflow:hidden;border:1px solid #e8ebee}
.card-head{background:var(--navy);color:#fff;padding:12px 15px;font-weight:900;border-left:5px solid var(--red)}.body{padding:14px}
.match{padding:13px 3px;border-bottom:1px solid #edf0f2}.match:last-child{border-bottom:0}.meta{text-align:center;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font-weight:900}.away{text-align:right}.score{font-size:22px;background:var(--navy);color:#fff;padding:7px 12px;border-radius:8px;box-shadow:inset 0 -3px #0003}.scheduled{background:#f0e4c8;color:#70551e}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:#eef1f4;color:#4b5967;font-size:11px;text-transform:uppercase}th,td{padding:10px 5px;border-bottom:1px solid #edf0f2;text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}.pos{font-weight:900;color:var(--red)}
.topscorer{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #edf0f2}.medal{width:34px;height:34px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:var(--navy);font-weight:900}.topscorer b{display:block}.topscorer small{color:var(--muted)}.goals{margin-left:auto;font-size:21px;font-weight:900;color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:linear-gradient(145deg,#fff,#f7f8f9);border:1px solid #e4e8eb;border-top:4px solid var(--gold);border-radius:13px;padding:18px;text-align:center}.stat b{display:block;font-size:28px;color:var(--navy)}.stat span{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase}
.full{grid-column:1/-1}.empty{color:var(--muted);padding:8px 0}footer{background:var(--navy);color:#b9c5d1;text-align:center;padding:22px;font-size:12px;border-top:4px solid var(--red)}
@media(max-width:720px){.hero-in{min-height:auto;padding:16px;gap:15px}.logo{width:118px;max-height:115px;border-radius:14px}.hero h1{font-size:25px}.hero p{font-size:12px}.kicker{font-size:10px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.nav button{padding:13px 14px}.card{border-radius:12px}}
</style></head><body>
<section class="hero"><div class="wrap hero-in"><img class="logo" src="./logo-copa-cap.png" alt="Emblema COPA CAP"><div><div class="kicker">TORNEIO DE FUTEBOL • ESCOLINHAS DE FUTEBOL</div><h1>COPA CAP 2026</h1><p>Resultados, classificação e números oficiais da competição.</p></div></div></section>
<nav class="nav"><div class="wrap nav-in" id="tabs"></div></nav>
<main><div class="cats" id="cats"></div><div id="app"></div></main>
<footer><b>COPA CAP 2026</b><br>ESPORTE • AMIZADE • FORMAÇÃO</footer>
<script>
const D={categorias:["Sub-8","Sub-10","Sub-14"],jogos:[
{cat:"Sub-8",rod:"1ª Rodada",casa:"Atlético A",fora:"União",pc:3,pf:1,status:"Encerrado",data:"20/09",hora:"08:00"},
{cat:"Sub-8",rod:"2ª Rodada",casa:"Estrela",fora:"Atlético A",status:"Agendado",data:"27/09",hora:"08:30"},
{cat:"Sub-10",rod:"1ª Rodada",casa:"Azul",fora:"Vermelho",pc:2,pf:2,status:"Encerrado",data:"20/09",hora:"09:00"},
{cat:"Sub-14",rod:"1ª Rodada",casa:"CAP",fora:"Amigos FC",pc:1,pf:0,status:"Encerrado",data:"20/09",hora:"10:00"}],
classificacao:{"Sub-8":[["Atlético A",1,1,0,0,3,1,2,3],["União",1,0,0,1,1,3,-2,0]],"Sub-10":[["Azul",1,0,1,0,2,2,0,1],["Vermelho",1,0,1,0,2,2,0,1]],"Sub-14":[["CAP",1,1,0,0,1,0,1,3],["Amigos FC",1,0,0,1,0,1,-1,0]]},
artilharia:{"Sub-8":[["João",3,"Atlético A"],["Pedro",1,"União"]],"Sub-10":[["Lucas",2,"Azul"],["Caio",2,"Vermelho"]],"Sub-14":[["Rafael",1,"CAP"]]}};
let cat="Sub-8",sec="inicio";const $=x=>document.getElementById(x);
function tabs(){let a=[["inicio","Início"],["jogos","Jogos"],["classificacao","Classificação"],["artilharia","Artilharia"],["numeros","Números"]];$("tabs").innerHTML=a.map(x=>`<button class="${sec===x[0]?"active":""}" onclick="sec='${x[0]}';render()">${x[1]}</button>`).join("")}
function cats(){$("cats").innerHTML=D.categorias.map(c=>`<button class="${cat===c?"active":""}" onclick="cat='${c}';render()">${c}</button>`).join("")}
function jogo(j){let fin=j.status==="Encerrado";return `<div class="match"><div class="meta">${j.rod} • ${j.data} • ${j.hora}</div><div class="teams"><span>${j.casa}</span><span class="score ${fin?"":"scheduled"}">${fin?j.pc+" × "+j.pf:j.hora}</span><span class="away">${j.fora}</span></div></div>`}
function tabela(){return `<table><thead><tr><th>#</th><th>Equipe</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th><th>PTS</th></tr></thead><tbody>${(D.classificacao[cat]||[]).map((r,i)=>`<tr><td class=pos>${i+1}</td><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[7]}</td><td><b>${r[8]}</b></td></tr>`).join("")}</tbody></table>`}
function art(){return (D.artilharia[cat]||[]).map((r,i)=>`<div class=topscorer><span class=medal>${i+1}</span><div><b>${r[0]}</b><small>${r[2]}</small></div><span class=goals>${r[1]} ⚽</span></div>`).join("")}
function render(){tabs();cats();let js=D.jogos.filter(j=>j.cat===cat),enc=js.filter(j=>j.status==="Encerrado"),prox=js.filter(j=>j.status!=="Encerrado");
if(sec==="inicio")$("app").innerHTML=`<div class=grid><section class=card><div class=card-head>PRÓXIMOS JOGOS</div><div class=body>${prox.length?prox.map(jogo).join(""):"<div class=empty>Nenhum jogo agendado.</div>"}</div></section><section class=card><div class=card-head>ÚLTIMOS RESULTADOS</div><div class=body>${enc.length?enc.map(jogo).join(""):"<div class=empty>Nenhum resultado.</div>"}</div></section><section class=card><div class=card-head>CLASSIFICAÇÃO • ${cat}</div>${tabela()}</section><section class=card><div class=card-head>ARTILHARIA • ${cat}</div><div class=body>${art()}</div></section></div>`;
if(sec==="jogos")$("app").innerHTML=`<section class=card><div class=card-head>JOGOS E RESULTADOS • ${cat}</div><div class=body>${js.map(jogo).join("")}</div></section>`;
if(sec==="classificacao")$("app").innerHTML=`<section class=card><div class=card-head>CLASSIFICAÇÃO • ${cat}</div>${tabela()}</section>`;
if(sec==="artilharia")$("app").innerHTML=`<section class=card><div class=card-head>ARTILHARIA • ${cat}</div><div class=body>${art()}</div></section>`;
if(sec==="numeros"){let gols=enc.reduce((s,j)=>s+(+j.pc||0)+(+j.pf||0),0);$("app").innerHTML=`<div class=stats><div class=stat><b>${enc.length}</b><span>Jogos</span></div><div class=stat><b>${gols}</b><span>Gols</span></div><div class=stat><b>${enc.length?(gols/enc.length).toFixed(1):"0"}</b><span>Gols por jogo</span></div><div class=stat><b>${D.classificacao[cat]?.length||0}</b><span>Equipes</span></div></div>`}}
render();if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script></body></html>
